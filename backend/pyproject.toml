[project]
name = "enterprise-cmdb-backend"
version = "0.1.0"
description = "Enterprise CMDB backend"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
