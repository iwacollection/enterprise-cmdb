name: Deploy AKS

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Kubernetes namespace
        required: true
        default: cmdb
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aks-${{ inputs.namespace }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
      CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      CMDB_DATABASE_URL: ${{ secrets.CMDB_DATABASE_URL }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      NAMESPACE: ${{ inputs.namespace }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            RESOURCE_GROUP \
            CLUSTER_NAME \
            ACR_NAME \
            ACR_LOGIN_SERVER \
            CMDB_DATABASE_URL; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production configuration: ${missing[*]}"
            exit 1
          fi

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Acquire AKS credentials
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing
          kubectl get nodes

      - name: Verify AKS can pull from ACR
        shell: bash
        run: |
          set -euo pipefail
          kubelet_object_id=$(az aks show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --query identityProfile.kubeletidentity.objectId \
            --output tsv)
          acr_id=$(az acr show --name "$ACR_NAME" --query id --output tsv)

          assignment_id=$(az role assignment list \
            --assignee-object-id "$kubelet_object_id" \
            --scope "$acr_id" \
            --query "[?roleDefinitionName=='AcrPull'].id | [0]" \
            --output tsv)

          if [[ -z "$assignment_id" ]]; then
            az role assignment create \
              --assignee-object-id "$kubelet_object_id" \
              --assignee-principal-type ServicePrincipal \
              --role AcrPull \
              --scope "$acr_id" \
              --output none
          else
            echo "AcrPull already present: $assignment_id"
          fi

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          image="$ACR_LOGIN_SERVER/enterprise-cmdb:$IMAGE_TAG"
          docker build -f backend/Dockerfile -t "$image" backend
          docker push "$image"
          echo "IMAGE_URI=$image" >> "$GITHUB_ENV"

      - name: Reconcile namespace and application secret
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic enterprise-cmdb-secrets \
            --from-literal=DATABASE_URL="$CMDB_DATABASE_URL" \
            --namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kustomize desired state
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -k k8s/base --namespace "$NAMESPACE"
          kubectl set image deployment/enterprise-cmdb \
            cmdb="$IMAGE_URI" \
            --namespace "$NAMESPACE"

      - name: Verify rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/enterprise-cmdb \
            --namespace "$NAMESPACE" \
            --timeout=180s
          kubectl get pods --namespace "$NAMESPACE" -o wide

      - name: Deployment failure diagnostics
        if: failure()
        shell: bash
        run: |
          kubectl get pods --namespace "$NAMESPACE" -o wide || true
          kubectl describe deployment/enterprise-cmdb --namespace "$NAMESPACE" || true
          kubectl get events --namespace "$NAMESPACE" --sort-by=.lastTimestamp | tail -80 || true
