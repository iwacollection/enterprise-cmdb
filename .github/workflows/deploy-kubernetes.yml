name: Deploy Kubernetes

on:
  workflow_dispatch:
    inputs:
      namespace:
        required: true
        default: cmdb
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Debug Azure Identity
        run: |
          az account show

      - name: Configure AKS credentials
        env:
          RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
          CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing
          kubectl get nodes

      - name: Login ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          if [ -z "$ACR_NAME" ] || [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "Missing ACR secrets"
            exit 1
          fi

          echo "Checking ACR: $ACR_NAME"
          az acr show --name "$ACR_NAME" --query "{name:name,loginServer:loginServer}" -o json

          TOKEN=$(az acr login \
            --name "$ACR_NAME" \
            --expose-token \
            --query accessToken \
            -o tsv)

          echo "$TOKEN" | docker login \
            "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build and push CMDB image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/enterprise-cmdb:$IMAGE_TAG" \
            .

          docker push "$ACR_LOGIN_SERVER/enterprise-cmdb:$IMAGE_TAG"

      - name: Deploy stateless CMDB
        env:
          NAMESPACE: ${{ inputs.namespace }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/base -n "$NAMESPACE"

          kubectl set image deployment/enterprise-cmdb \
            cmdb="$ACR_LOGIN_SERVER/enterprise-cmdb:$IMAGE_TAG" \
            -n "$NAMESPACE"

          if ! kubectl rollout status deployment/enterprise-cmdb -n "$NAMESPACE" --timeout=180s; then
            kubectl get pods -n "$NAMESPACE" -o wide || true
            kubectl describe pods -n "$NAMESPACE" || true
            kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp || true
            kubectl logs -n "$NAMESPACE" -l app=enterprise-cmdb --tail=200 || true
            exit 1
          fi

          kubectl get pods -n "$NAMESPACE"
          kubectl get svc -n "$NAMESPACE"
