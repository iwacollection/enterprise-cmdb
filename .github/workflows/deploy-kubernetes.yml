name: Deploy Kubernetes

on:
  workflow_dispatch:
    inputs:
      namespace:
        required: true
        default: cmdb
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS credentials
        env:
          RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
          CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing
          kubectl get nodes

      - name: Ensure AKS kubelet can pull ACR images
        env:
          RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
          CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          KUBELET_OBJECT_ID=$(az aks show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --query identityProfile.kubeletidentity.objectId \
            -o tsv)

          ACR_ID=$(az acr show \
            --name "$ACR_NAME" \
            --query id \
            -o tsv)

          az role assignment create \
            --assignee-object-id "$KUBELET_OBJECT_ID" \
            --assignee-principal-type ServicePrincipal \
            --role AcrPull \
            --scope "$ACR_ID" || true

      - name: Login ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          TOKEN=$(az acr login \
            --name "$ACR_NAME" \
            --expose-token \
            --query accessToken \
            -o tsv)

          echo "$TOKEN" | docker login \
            "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build and push CMDB image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "$ACR_LOGIN_SERVER/enterprise-cmdb:$IMAGE_TAG" \
            backend

          docker push "$ACR_LOGIN_SERVER/enterprise-cmdb:$IMAGE_TAG"

      - name: Create Kubernetes runtime secret
        env:
          NAMESPACE: ${{ inputs.namespace }}
          CMDB_DATABASE_URL: ${{ secrets.CMDB_DATABASE_URL }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          if [ -z "$CMDB_DATABASE_URL" ]; then
            echo "Missing CMDB_DATABASE_URL secret"
            exit 1
          fi

          kubectl create secret generic enterprise-cmdb-secrets \
            --from-literal=DATABASE_URL="$CMDB_DATABASE_URL" \
            -n "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy stateless CMDB
        env:
          NAMESPACE: ${{ inputs.namespace }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl apply -k k8s/base -n "$NAMESPACE"

          kubectl set image deployment/enterprise-cmdb \
            cmdb="$ACR_LOGIN_SERVER/enterprise-cmdb:$IMAGE_TAG" \
            -n "$NAMESPACE"

          kubectl rollout status deployment/enterprise-cmdb \
            -n "$NAMESPACE" \
            --timeout=180s

          kubectl get pods -n "$NAMESPACE"
          kubectl get svc -n "$NAMESPACE"
