name: Deploy Kubernetes

on:
  workflow_dispatch:
    inputs:
      namespace:
        required: true
        default: cmdb
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS credentials
        env:
          RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
          CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
        run: |
          if [ -z "$RESOURCE_GROUP" ] || [ -z "$CLUSTER_NAME" ]; then
            echo "Missing AKS_RESOURCE_GROUP or AKS_CLUSTER_NAME secret"
            exit 1
          fi

          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing

          kubectl version --client
          kubectl get nodes

      - name: Deploy stateless CMDB
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/base -n "$NAMESPACE"
          kubectl rollout status deployment/enterprise-cmdb -n "$NAMESPACE" --timeout=180s
          kubectl get pods -n "$NAMESPACE"
