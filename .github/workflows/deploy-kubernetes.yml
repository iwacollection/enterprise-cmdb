name: Deploy Kubernetes

on:
  workflow_dispatch:
    inputs:
      namespace:
        required: true
        default: cmdb
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Unified AKS CMDB Deployment Pipeline
        env:
          RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
          CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          NAMESPACE: ${{ inputs.namespace }}
          CMDB_DATABASE_URL: ${{ secrets.CMDB_DATABASE_URL }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo '========== AKS CREDENTIAL =========='
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing

          kubectl get nodes

          echo '========== ACR PERMISSION =========='
          KUBELET_OBJECT_ID=$(az aks show --resource-group "$RESOURCE_GROUP" --name "$CLUSTER_NAME" --query identityProfile.kubeletidentity.objectId -o tsv)
          ACR_ID=$(az acr show --name "$ACR_NAME" --query id -o tsv)
          az role assignment create --assignee-object-id "$KUBELET_OBJECT_ID" --assignee-principal-type ServicePrincipal --role AcrPull --scope "$ACR_ID" || true

          echo '========== BUILD PUSH =========='
          az acr login --name "$ACR_NAME"
          docker build -f backend/Dockerfile -t "$ACR_LOGIN_SERVER/enterprise-cmdb:$IMAGE_TAG" backend
          docker push "$ACR_LOGIN_SERVER/enterprise-cmdb:$IMAGE_TAG"

          echo '========== SECRET =========='
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          DATABASE_URL="${CMDB_DATABASE_URL:-postgresql://bootstrap-placeholder}"
          kubectl create secret generic enterprise-cmdb-secrets \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            -n "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo '========== DEPLOY =========='
          kubectl apply -k k8s/base -n "$NAMESPACE"
          kubectl set image deployment/enterprise-cmdb cmdb="$ACR_LOGIN_SERVER/enterprise-cmdb:$IMAGE_TAG" -n "$NAMESPACE"

          echo '========== ROLLOUT =========='
          kubectl rollout status deployment/enterprise-cmdb -n "$NAMESPACE" --timeout=180s
          kubectl get pods -n "$NAMESPACE"