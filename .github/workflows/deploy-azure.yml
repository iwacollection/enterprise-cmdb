name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Azure resource group
        required: true
        default: rg-enterprise-cmdb
        type: string
      location:
        description: Azure region
        required: true
        default: eastasia
        type: string
      name_prefix:
        description: Short alphanumeric resource prefix
        required: true
        default: cmdb
        type: string
      auto_request_quota:
        description: Automatically request supported Azure quota increases when capacity is exhausted
        required: true
        default: true
        type: boolean
  push:
    branches:
      - deploy/azure-production
    paths:
      - .github/deploy-production

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      RESOURCE_GROUP: ${{ inputs.resource_group || 'rg-enterprise-cmdb' }}
      LOCATION: ${{ inputs.location || 'eastasia' }}
      NAME_PREFIX: ${{ inputs.name_prefix || 'cmdb' }}
      AUTO_REQUEST_QUOTA: "true"
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      POSTGRES_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve manual deployment inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "AUTO_REQUEST_QUOTA=${{ inputs.auto_request_quota }}" >> "$GITHUB_ENV"

      - name: Validate Azure deployment credentials
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$AZURE_CLIENT_ID" ]] || missing+=(AZURE_CLIENT_ID)
          [[ -n "$AZURE_TENANT_ID" ]] || missing+=(AZURE_TENANT_ID)
          [[ -n "$AZURE_SUBSCRIPTION_ID" ]] || missing+=(AZURE_SUBSCRIPTION_ID)
          [[ -n "$POSTGRES_PASSWORD" ]] || missing+=(AZURE_POSTGRES_ADMIN_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub production secrets: ${missing[*]}. Configure them in the repository production environment before Azure deployment can run."
            exit 1
          fi

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure quota tooling
        run: |
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.Quota --wait
          az extension add --name quota --upgrade --only-show-errors

      - name: Ensure resource group
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output none

      - name: Preflight regional Container Apps quota
        run: |
          set -euo pipefail
          policy_file="infra/azure/quota-policy.json"
          subscription_id=$(az account show --query id --output tsv)
          quota_scope="/subscriptions/${subscription_id}/providers/Microsoft.App/locations/${LOCATION}"
          environment_name="${NAME_PREFIX}-env"

          environment_exists=false
          if az containerapp env show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$environment_name" \
            --output none >/dev/null 2>&1; then
            environment_exists=true
          fi

          az containerapp list-usages \
            --location "$LOCATION" \
            --query '{value:@}' \
            --output json > regional-usage.json

          minimum_limit=$(jq -r '.containerApps.regional.ManagedEnvironmentCount.minimumLimit' "$policy_file")
          request_increment=$(jq -r '.containerApps.regional.ManagedEnvironmentCount.requestIncrement' "$policy_file")
          poll_attempts=$(jq -r '.containerApps.regional.ManagedEnvironmentCount.pollAttempts' "$policy_file")
          poll_seconds=$(jq -r '.containerApps.regional.ManagedEnvironmentCount.pollSeconds' "$policy_file")

          decision=$(python3 infra/azure/quota_guard.py regional \
            --usage-file regional-usage.json \
            --environment-exists "$environment_exists" \
            --minimum-limit "$minimum_limit" \
            --request-increment "$request_increment")
          echo "Regional quota decision: $decision"

          if [[ "$(jq -r '.action' <<<"$decision")" == "ok" ]]; then
            exit 0
          fi

          if [[ "$AUTO_REQUEST_QUOTA" != "true" ]]; then
            echo "::error::Azure Container Apps ManagedEnvironmentCount quota is exhausted in ${LOCATION}, and automatic quota requests are disabled."
            exit 1
          fi

          requested_limit=$(jq -r '.requestedLimit' <<<"$decision")
          echo "Requesting ManagedEnvironmentCount quota limit ${requested_limit} in ${LOCATION}."

          if ! az quota update \
            --resource-name ManagedEnvironmentCount \
            --scope "$quota_scope" \
            --limit-object "value=${requested_limit}" \
            --no-wait false \
            --output json > quota-request.json; then
            echo "::error::Automatic quota request failed. The deployment identity needs Microsoft.Quota/quotas/write, normally via Quota Request Operator."
            exit 1
          fi

          for ((attempt=1; attempt<=poll_attempts; attempt++)); do
            az containerapp list-usages \
              --location "$LOCATION" \
              --query '{value:@}' \
              --output json > regional-usage.json
            decision=$(python3 infra/azure/quota_guard.py regional \
              --usage-file regional-usage.json \
              --environment-exists "$environment_exists" \
              --minimum-limit "$minimum_limit" \
              --request-increment "$request_increment")
            echo "Quota poll ${attempt}/${poll_attempts}: $decision"
            if [[ "$(jq -r '.action' <<<"$decision")" == "ok" ]]; then
              exit 0
            fi
            sleep "$poll_seconds"
          done

          echo "::error::Quota request was submitted but ManagedEnvironmentCount did not become usable before the deployment polling window ended."
          exit 1

      - name: Deploy Azure foundation
        id: foundation
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              location="$LOCATION" \
              deployContainerApp=false \
              postgresAdministratorPassword="$POSTGRES_PASSWORD" \
            --query properties.outputs \
            --output json)

          acr_name=$(echo "$outputs" | jq -r '.acrName.value')
          acr_server=$(echo "$outputs" | jq -r '.acrLoginServer.value')
          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"
          echo "acr_server=$acr_server" >> "$GITHUB_OUTPUT"

      - name: Preflight Container Apps environment core quota
        run: |
          set -euo pipefail
          policy_file="infra/azure/quota-policy.json"
          environment_name="${NAME_PREFIX}-env"
          required_available=$(jq -r '.containerApps.environment.ManagedEnvironmentConsumptionCores.requiredAvailable' "$policy_file")

          az containerapp env list-usages \
            --resource-group "$RESOURCE_GROUP" \
            --name "$environment_name" \
            --query '{value:@}' \
            --output json > environment-usage.json

          decision=$(python3 infra/azure/quota_guard.py environment \
            --usage-file environment-usage.json \
            --required-available "$required_available")
          echo "Environment quota decision: $decision"

          if [[ "$(jq -r '.action' <<<"$decision")" != "ok" ]]; then
            echo "::error::Managed Environment Consumption Cores requires a manual Azure Container Apps quota request. decision=${decision}"
            exit 1
          fi

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ steps.foundation.outputs.acr_name }}"

      - name: Build and push CMDB image
        id: image
        env:
          ACR_SERVER: ${{ steps.foundation.outputs.acr_server }}
        run: |
          image="$ACR_SERVER/enterprise-cmdb:${GITHUB_SHA}"
          docker build --file backend/Dockerfile --tag "$image" backend
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy private CMDB with Entra auth
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              location="$LOCATION" \
              deployContainerApp=true \
              enableEntraAuth=true \
              externalIngressEnabled=false \
              containerImage="$CONTAINER_IMAGE" \
              postgresAdministratorPassword="$POSTGRES_PASSWORD" \
            --output none

      - name: Verify Entra auth configuration
        id: auth
        run: |
          app_name="${NAME_PREFIX}-app"
          auth_json=$(az containerapp auth show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$app_name" \
            --output json)

          test "$(echo "$auth_json" | jq -r '.platform.enabled')" = "true"
          test "$(echo "$auth_json" | jq -r '.identityProviders.azureActiveDirectory.enabled')" = "true"

          client_id=$(echo "$auth_json" | jq -r '.identityProviders.azureActiveDirectory.registration.clientId')
          test -n "$client_id"
          test "$client_id" != "null"

          assignment_required=$(az ad sp show --id "$client_id" --query appRoleAssignmentRequired --output tsv)
          test "$assignment_required" = "true"
          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"

      - name: Enable authenticated external ingress
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              location="$LOCATION" \
              deployContainerApp=true \
              enableEntraAuth=true \
              externalIngressEnabled=true \
              containerImage="$CONTAINER_IMAGE" \
              postgresAdministratorPassword="$POSTGRES_PASSWORD" \
            --output none

      - name: Verify active revision and protected endpoint
        env:
          ENTRA_CLIENT_ID: ${{ steps.auth.outputs.client_id }}
        run: |
          app_name="${NAME_PREFIX}-app"
          revision=$(az containerapp revision list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$app_name" \
            --query "[?properties.active].name | [0]" \
            --output tsv)
          test -n "$revision"

          fqdn=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$app_name" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          test -n "$fqdn"

          curl --fail --silent --show-error --retry 10 --retry-delay 5 "https://${fqdn}/health"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://${fqdn}/ui/")
          test "$status" = "302"

          echo "Active revision: $revision"
          echo "CMDB URL: https://${fqdn}/ui/"
          echo "Entra application client ID: $ENTRA_CLIENT_ID"
          echo "Assign CMDB.Reader or CMDB.Admin before interactive sign-in."

      - name: Publish deployment result
        if: ${{ always() && github.ref_name == 'deploy/azure-production' }}
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          mkdir -p docs/deployment
          cat > docs/deployment/last-azure-production-status.md <<EOF
          # Last Azure Production Deployment

          status: ${DEPLOY_STATUS}
          run_id: ${GITHUB_RUN_ID}
          run_attempt: ${GITHUB_RUN_ATTEMPT}
          commit: ${GITHUB_SHA}
          resource_group: ${RESOURCE_GROUP}
          location: ${LOCATION}
          name_prefix: ${NAME_PREFIX}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deployment/last-azure-production-status.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy: record Azure production result"
          git push origin "HEAD:${GITHUB_REF_NAME}"
