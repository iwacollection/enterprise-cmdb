name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Application and Delivery Validation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check app tests

      - name: Validate web console
        run: node --check app/web/app.js

      - name: Test
        run: uv run pytest -q

      - name: Verify migrations
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci-migrations.db
        run: |
          set -euo pipefail
          rm -f ci-migrations.db
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Validate compose runtime
        run: docker compose config -q

      - name: Smoke test PostgreSQL runtime
        run: |
          set -euo pipefail
          cleanup() {
            docker compose down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose up --build --detach --wait
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready

      - name: Build container
        run: docker build -t enterprise-cmdb:test .

      - name: Validate Kubernetes Kustomize source
        working-directory: ${{ github.workspace }}
        run: kubectl kustomize k8s/base >/dev/null

      - name: Validate Azure bootstrap script
        working-directory: ${{ github.workspace }}
        run: bash -n infra/azure/bootstrap-github-oidc.sh

      - name: Test Azure quota policy
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s infra/azure/tests -p 'test_*.py' -v

      - name: Validate Azure Bicep
        working-directory: ${{ github.workspace }}
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null
