apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-cmdb
  labels:
    app: enterprise-cmdb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-cmdb
  template:
    metadata:
      labels:
        app: enterprise-cmdb
    spec:
      containers:
        - name: cmdb
          image: enterprise-cmdb:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: enterprise-cmdb-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
